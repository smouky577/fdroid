Name: Real BC
Summary: Ballistic coefficient from measured velocities
Description: |-
  Real BC calculates the real ballistic coefficient (G1/G7) of an air-rifle
  pellet or slug from velocities measured at different distances.

  Реален BC: балистичен коефициент от измерени скорости.
