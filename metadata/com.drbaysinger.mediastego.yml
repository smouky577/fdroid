Name: MediaStego
Summary: Hide encrypted text in a WAV or PNG
Description: |-
  MediaStego hides encrypted text, a file, or a voice recording inside a WAV
  or PNG. The picture or sound looks the same.

  Скрит криптиран текст, файл или глас в WAV или PNG.
